# Ejemplo B.2 de IEEE Std 80-2013 (Anexo B): malla cuadrada de 70 m x 70 m con
# 20 varillas de 7,5 m en el perímetro. Resultado de la norma: Rg = 2,75 Ω,
# Em = 747,4 V, Es = 548,9 V; cumple con 838,2 V (toque) y 2686,6 V (paso).
# Sirve de plantilla: copie este archivo y reemplace los datos de su subestación.
peso_kg: 70                 # 50 o 70 kg (ec. 29-33)
material: cu_duro           # clave de la Tabla 2 (ver power_studies/puesta_tierra.py: KF)
suelo:
  rho: 400                  # Ω·m, del modelo del terreno (sondeos de resistividad)
  rho_s: 2500               # Ω·m, gravilla húmeda
  h_s: 0.102                # m
malla:
  lx: 70                    # m
  ly: 70                    # m
  nx: 11                    # conductores paralelos al eje x
  ny: 11                    # conductores paralelos al eje y
  h: 0.5                    # m, profundidad
  d: 0.01                   # m, diámetro del conductor
  n_varillas: 20
  l_varilla: 7.5            # m
  varillas_en_perimetro: true
falla:
  tres_i0: 3180             # A, falla a tierra que eleva el GPR (en 115 kV)
  i_calibre: 6814           # A, mayor falla a tierra (13 kV), para el calibre
  sf: 0.6                   # factor de división de corriente
  tf: 0.5                   # s
  # Alternativa: tomar 3I0 de la falla 1F del modelo de red (IEC 60909)
  # desde_red: {red: ../subestacion_75kva/red.yaml, barra: MT, escenario: base}
